[alembic]
# Alembic configuration for the CI Agent audit database (Batch 2).
# The URL may be overridden per environment via the DATABASE_URL env variable
# (src/ci_agent/db/migrations/env.py reads it). `prepend_sys_path` makes the
# package importable from a plain source checkout.
script_location = src/ci_agent/db/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url = sqlite:///./ci_agent.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
