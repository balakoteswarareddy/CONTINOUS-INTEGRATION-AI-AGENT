# Allow-listed command construction for compiled pipeline steps (Batch 4, Task A).
#
# Section 7.3 "Tool misuse ... Enforce command schemas, argument validation and
# allow-lists": these entries are the ONLY shell commands the compiler may ever
# emit. There is no dynamic command construction from free-form tool names,
# ever — the command_template_registry raises UnknownCommandTemplateError for
# any id not present here.
#
# Keys are the command_template_id values referenced by the Batch 3 stage
# templates (python.yaml / nodejs.yaml). A null value means the step is handled
# natively by a pinned runner action instead of a shell command.
"checkout.default": null          # handled natively by actions/checkout (pinned)
"lint.ruff": "ruff check ."
"sast.bandit": "bandit -r . -f json -o bandit-report.json"
"tests.pytest": "pytest --junitxml=results.xml"
"scan.gitleaks": "gitleaks detect --source . --report-format json --report-path gitleaks-report.json"
"scan.pip-audit": "pip-audit -f json > pip-audit-report.json"
"lint.eslint": "npx eslint -f json -o eslint-report.json"
"sast.semgrep": "semgrep scan --config auto --json --output semgrep-report.json"
"tests.vitest": "npx vitest run --reporter=junit --outputFile=results.xml"
"scan.npm-audit": "npm audit --json > npm-audit-report.json"

# --- Phase B (Batch 7; Report Section 5.2) ---------------------------------
# Every entry below is a fixed, reviewable allow-list value — never dynamic
# command construction. The build/scan/sign/publish chain operates on ONE
# locally-tagged image (ci-agent/app:ci); its content digest (docker inspect
# .Id, captured into image-digest.txt) — NOT the tag — is the artifact
# identity (Section 8: "use immutable digest as the primary identity").
"build.default.python": "pytest --cov=src --cov-branch --cov-report=xml --junitxml=results.xml && python -m build --wheel --outdir dist/"
"build.default.nodejs": "npm ci && npm run test:coverage && npm run build"
"test.integration.python": "pytest tests/integration --junitxml=integration-results.xml"
"test.integration.nodejs": "npx vitest run tests/integration --reporter=junit --outputFile=integration-results.xml"
"container.build": "docker buildx build --load --tag ci-agent/app:ci --file Dockerfile . && docker inspect --format '{{.Id}}' ci-agent/app:ci > image-digest.txt"
"sbom.syft": "syft ci-agent/app:ci -o spdx-json=sbom.json"
"scan.trivy": "trivy image --format json --output trivy-report.json ci-agent/app:ci"
"sign.cosign": "cosign sign --key env://COSIGN_KEY --output-signature image.sig --output-payload image.payload ci-agent/app:ci && cosign attest --key env://COSIGN_KEY --predicate provenance.json --type slsaprovenance ci-agent/app:ci > image-attestation.json"
"publish.oci": "docker tag ci-agent/app:ci \"$CI_AGENT_PUBLISH_REF\" && docker push \"$CI_AGENT_PUBLISH_REF\""
