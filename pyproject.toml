[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-agent"
version = "0.1.0"
description = "Vendor-neutral CI Agent control plane: canonical data models and versioned governance catalog (Batch 1)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "CI Agent Team" }]
keywords = ["ci", "continuous-integration", "policy-as-code", "supply-chain"]

# Runtime dependencies are intentionally minimal in Batch 1 (types + config).
# Batch 2 adds: FastAPI (ingress), SQLAlchemy 2.0 + Alembic (audit store),
# httpx (HTTP client / FastAPI TestClient transport).
# FastAPI / SQLAlchemy / DB drivers / AI SDKs beyond these arrive in later batches.
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ci_agent = [
    "governance/schemas/*.schema.json",
    "governance/catalog/*.yaml",
    "governance/catalog/policies/*.yaml",
    "planner/templates/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: end-to-end tests (may require live services; graceful skip when unavailable)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# __init__.py files re-export the public API.
"__init__.py" = ["F401"]
# The CLI bootstraps sys.path before importing ci_agent so it can run from a
# plain source checkout without installation (documented in NOTES.md).
"scripts/validate_governance.py" = ["E402"]
# Batch 1 spec mandates enums "subclass str, Enum" — keep that exact form
# instead of enum.StrEnum (documented in NOTES.md Section 5).
"src/ci_agent/core/models/common.py" = ["UP042"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["src/ci_agent", "scripts/validate_governance.py"]
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["yaml", "jsonschema"]
ignore_missing_imports = true
